<!DOCTYPE html>
<html>
  <body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#0a0a0a; color:#f5f5f5; padding:32px;">
    <div style="max-width:480px; margin:0 auto; background:#161616; border:1px solid #2a2a2a; border-radius:16px; padding:32px;">
      <h1 style="margin:0 0 8px; font-size:22px;">Confirm your email</h1>
      <p style="color:#a3a3a3; margin:0 0 24px;">Enter this 6-digit code in WorkBridge to finish signing up.</p>
      <div style="font-size:36px; font-weight:700; letter-spacing:8px; text-align:center; background:#0a0a0a; border:1px solid #2a2a2a; border-radius:12px; padding:20px 0;">
        {{ .Token }}
      </div>
      <p style="color:#737373; font-size:12px; margin-top:24px;">The code expires in 1 hour. If you didn't request this, you can safely ignore the email.</p>
    </div>
  </body>
</html>
